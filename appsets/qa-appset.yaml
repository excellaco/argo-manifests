apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: qa-appset
  namespace: qa
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/excellaco/argo-manifests.git
      revision: feature/appsets
      directories:
      - path: apps/*/envs/qa
  template:
    metadata:
      name: '{{index .path.segments 1}}-{{index .path.segments 3}}'
    spec:
      project: exemplar
      source:
        repoURL: https://github.com/excellaco/argo-manifests.git
        targetRevision: feature/appsets
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 1}}-{{index .path.segments 3}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
