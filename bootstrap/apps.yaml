apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-bootstrap
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/excellaco/argo-manifests.git
    targetRevision: feature/helm
    path: appsets
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
