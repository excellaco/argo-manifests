apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-tests
spec:
  args:
    - name: route-host
  metrics:
    - name: smoke-test
      provider:
        job:
          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 2
            template:
              spec:
                containers:
                  - name: curl-test
                    image: curlimages/curl:latest
                    command:
                      - sh
                      - -c
                      - |
                        # Simple smoke test for route
                        echo "Testing route: ${ROUTE_HOST}"
                        sleep 5  # Brief wait for route readiness

                        # Try up to 3 times
                        for i in {1..3}; do
                          echo "Attempt $i/3..."
                          
                          # Make request and get status code only
                          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k --connect-timeout 5 --max-time 10 https://${ROUTE_HOST})
                          
                          echo "Status code: $STATUS"
                          
                          # Check if successful
                          if [ "$STATUS" = "200" ]; then
                            echo "PASSED: Smoke test successful!"
                            exit 0
                          fi
                          
                          # Retry if not last attempt
                          [ $i -lt 3 ] && echo "Retrying in 5 seconds..." && sleep 5
                        done

                        echo "FAILED: Expected status 200, got $STATUS"
                        exit 1
                    env:
                      - name: ROUTE_HOST
                        value: "{{args.route-host}}"
                restartPolicy: Never